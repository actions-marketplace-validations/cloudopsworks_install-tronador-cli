name: Install Tronador CLI
description: Install the CloudOps Works Tronador CLI from GitHub Releases.
author: CloudOps Works

inputs:
  version:
    description: Release version to install (for example, 0.2.3 or v0.2.3). Defaults to the latest stable release.
    required: false
    default: latest
  install-dir:
    description: Directory where the Tronador executable is installed. Defaults to the runner tool cache.
    required: false
    default: ''
  token:
    description: >-
      Token used to authenticate the latest-release lookup and the release downloads. Authenticated
      requests are rate limited per token instead of per runner IP address, which avoids HTTP 403
      rate limit failures on busy runners. Defaults to `github.token` on github.com and to anonymous
      access on GitHub Enterprise Server, whose token github.com would reject. Set to '' to force
      anonymous requests.
    required: false
    default: ${{ github.server_url == 'https://github.com' && github.token || '' }}

outputs:
  version:
    description: The installed release tag.
  path:
    description: Absolute path to the installed Tronador executable.
  cache-hit:
    description: Whether the release was served from the runner tool cache instead of being downloaded.

runs:
  using: node24
  main: dist/index.mjs

branding:
  icon: download
  color: blue
